[project]
name = "ragforge"
version = "0.1.0"
description = "Production-grade self-hosted RAG: hybrid search, HyDE, reranking, multi-modal ingestion"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  # Core agent
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-core>=0.3.0",
  "langgraph>=0.2.0",
  "pydantic>=2.0.0",
  # LLM client
  "openai>=1.0.0",
  "httpx>=0.27.0",
  # Chunking / tokenisation
  "tiktoken>=0.5.0",
  # Ingestion — tables
  "pandas>=2.0.0",
  "openpyxl>=3.1.5",
  # Ingestion — PDF page count
  "pypdf>=4.0.0",
  # Sparse embeddings (BM42)
  "fastembed>=0.3.0",
  # Local reranker
  "transformers>=4.40.0",
  "torch>=2.2.0",
  # Observability
  "langfuse>=2.0.0,<3.0.0",
  # UI
  "streamlit>=1.35.0",
  # Env
  "python-dotenv>=1.0.0",
  "langchain-text-splitters>=1.1.1",
  "pypdfium2>=5.6.0",
  "chandra-ocr>=0.2.0",
  "pillow>=12.1.1",
  "requests>=2.33.0",
  "pymupdf4llm>=1.27.2.2",
]
