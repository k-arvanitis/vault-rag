[project]
name = "vault-rag"
version = "0.1.0"
description = "Production-grade self-hosted RAG: hybrid search, HyDE, reranking, multi-modal ingestion"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  # Core agent
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-core>=0.3.0",
  "langgraph>=0.2.0",
  "pydantic>=2.0.0",
  # LLM client
  "openai>=1.0.0",
  "httpx>=0.27.0",
  # Chunking / tokenisation
  "tiktoken>=0.5.0",
  # Ingestion — tables
  "pandas>=2.0.0",
  "openpyxl>=3.1.5",
  # Ingestion — PDF page count
  "pypdf>=4.0.0",
  # Sparse embeddings (BM42)
  "fastembed>=0.3.0",
  # Local reranker
  "transformers>=4.40.0",
  "torch>=2.2.0",
  "accelerate>=0.30.0",
  # Observability
  "langfuse>=2.0.0,<3.0.0",
  "langsmith>=0.1.0",
  # UI
  "streamlit>=1.35.0",
  # Env
  "python-dotenv>=1.0.0",
  "langchain-text-splitters>=1.1.1",
  "pypdfium2>=5.6.0",
  "chandra-ocr>=0.2.0",
  "pillow>=12.1.1",
  "requests>=2.33.0",
  "pymupdf4llm>=1.27.2.2",
  # Slack interface
  "slack-bolt>=1.18.0",
  "datasets>=4.8.4",
  "deepeval>=3.9.7",
  "duckdb>=1.5.2",
  "fastapi>=0.136.1",
  "uvicorn>=0.46.0",
  "python-multipart>=0.0.27",
  # CPU OCR fallback (PDF_PARSER=cpu) — avoids the GPU LightOn vLLM dependency
  "unstructured[pdf]>=0.15.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.4.0",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
