services:

  # ── Vector database ──────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: qdrant-rag
    restart: unless-stopped
    ports:
      - "${QDRANT_REST_PORT:-7333}:6333"
      - "${QDRANT_GRPC_PORT:-7334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - vault

  # ── Semantic cache store (Redis Stack = Redis + vector search) ──────────────
  # Plain redis:7 will NOT work — LiteLLM's semantic cache needs RediSearch.
  redis:
    image: redis/redis-stack-server:latest
    container_name: vault-redis
    restart: unless-stopped
    ports:
      # Host 6380 (6379 is often taken by another project's redis); litellm
      # reaches it as redis:6379 over the vault network regardless of this.
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - vault

  # ── LLM proxy (Groq primary → OpenRouter fallback) ──────────────────────────
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_NIM_API_KEY=${NVIDIA_API_KEY:-}    # semantic-cache embedder auth
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # Ollama + Langfuse run on the HOST (not in compose) on this box, so the
      # container reaches them via host.docker.internal (see extra_hosts below).
      - OLLAMA_API_BASE=http://ollama:11434   # semantic-cache embedder (container ollama)
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-}
      - LANGFUSE_HOST=http://host.docker.internal:3000
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "2"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:4000/health/liveliness', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - vault

  # ── Embeddings (nomic-embed-text pulled on first start) ──────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    # Explicit public DNS — this box's default resolver isn't reachable from
    # containers, which otherwise breaks `ollama pull`.
    dns:
      - "8.8.8.8"
      - "1.1.1.1"
    ports:
      # Host 11435 (a host-level ollama already owns 11434); litellm reaches
      # this one as ollama:11434 over the vault network regardless.
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Serve in background, pull the embedding model, then keep serving.
    # `|| true` so a transient pull failure doesn't crash-loop the container
    # once the model is already cached in the volume.
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 8 && (ollama pull nomic-embed-text || true) && wait"]
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q nomic-embed-text"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    networks:
      - vault

  # ── LightOn OCR — GPU only ───────────────────────────────────────────────────
  # Start with: docker compose --profile gpu up
  # Requires NVIDIA container runtime and a CUDA 12+ GPU.
  # Born-digital PDFs, Excel, and Markdown work without this service.
  lightonocr:
    profiles: [gpu]
    image: vllm/vllm-openai:v0.17.0
    container_name: lightonocr-vllm
    restart: unless-stopped
    network_mode: host
    ipc: host
    environment:
      - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    volumes:
      - hf_cache_lightonocr:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - ${LIGHTON_MODEL_TAG:-lightonai/lightonocr-2-1b-ocr-soup}
      - --served-model-name
      - ${LIGHTON_SERVED_MODEL_NAME:-lightonocr-2-1b-ocr-soup}
      - --host
      - 0.0.0.0
      - --port
      - "${LIGHTON_PORT:-8002}"
      - --tensor-parallel-size
      - "1"
      - --max-model-len
      - "${LIGHTON_MAX_MODEL_LEN:-16384}"
      - --gpu-memory-utilization
      - "${LIGHTON_GPU_MEMORY_UTILIZATION:-0.30}"

  # ── FastAPI backend ───────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RERANKER_MODEL: ${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
    container_name: vault-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8001}:8001"
    env_file:
      - .env
    environment:
      # Container-network URLs override the localhost-oriented .env.example defaults.
      - QDRANT_URL=http://qdrant:6333
      - GENERATION_API_BASE=http://litellm:4000/v1
      - OLLAMA_API_BASE=http://ollama:11434
      - EMBED_API_BASE=http://ollama:11434
      - OCR_API_BASE=http://lightonocr:8002
      - API_CORS_ORIGINS=http://localhost:3000
    volumes:
      - ./data:/app/data
      - ./eval:/app/eval
      # DUCKDB_PATH (.env's default: .duckdb/vault.db) is NOT under ./data --
      # without this mount, every Excel/CSV table the SQL agent cleans (real
      # LLM calls) would be silently lost on container recreate.
      - ./.duckdb:/app/.duckdb
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      qdrant:
        condition: service_healthy
      litellm:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - vault

  # ── Next.js chat UI ───────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Browser-facing URL — the host-published api port, not the container name.
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8001}
    container_name: vault-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy
    networks:
      - vault

networks:
  vault:
    driver: bridge

volumes:
  qdrant_data:
    name: vault_rag_qdrant
  redis_data:
    name: vault_rag_redis
  ollama_data:
    name: vault_rag_ollama
  hf_cache_lightonocr:
    name: vault_rag_hf_cache
