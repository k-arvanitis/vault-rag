# LiteLLM Proxy — Vault RAG gateway
#
# Exposes a single OpenAI-compatible endpoint at http://localhost:4000/v1
# The app sends model name "qwen/qwen3-32b" (GENERATION_MODEL); all four
# entries share that name, so LiteLLM treats them as one failover chain:
#   1. Local vLLM  — Qwen3 32B AWQ   (primary agent model)
#   2. Groq        — Qwen3 32B       (fallback)
#   3. Groq        — Llama 3.3 70B   (fallback, same org as #2 — no protection
#                                      if Groq itself is down/suspended)
#   4. OpenRouter   — Qwen3 32B       (real cross-provider fallback)
#
# Start with:  make litellm
#              OR  litellm --config litellm_config.yaml --port 4000

model_list:
  # ── Primary: local vLLM Qwen3 32B AWQ ────────────────────────────────────
  - model_name: qwen/qwen3-32b
    litellm_params:
      model: openai/qwen3-32b
      api_base: http://host.docker.internal:8005/v1
      api_key: "no-key"
      max_tokens: 4096

  # ── Fallback #1: Groq Qwen3 32B ──────────────────────────────────────────
  - model_name: qwen/qwen3-32b               # the name your app sends
    litellm_params:
      model: groq/qwen/qwen3-32b
      api_key: os.environ/GROQ_API_KEY
      max_tokens: 4096

  # ── Fallback #2: Groq Llama 3.3 70B ──────────────────────────────────────
  - model_name: qwen/qwen3-32b               # same name -> automatic fallback
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY
      max_tokens: 4096

  # ── Fallback #3: OpenRouter Qwen3 32B ─────────────────────────────────────
  # Cross-provider fallback — survives a Groq-org-wide outage, unlike #1.
  # max_tokens is higher than the other tiers because this route can return
  # reasoning tokens before the final answer; a low cap truncates mid-thought
  # and yields an empty message.content.
  - model_name: qwen/qwen3-32b               # same name -> third-tier fallback
    litellm_params:
      model: openrouter/qwen/qwen3-32b
      api_key: os.environ/OPENROUTER_API_KEY
      max_tokens: 8192

router_settings:
  # How many times to retry a failed request before giving up
  num_retries: 3
  # Seconds to wait between retries
  retry_after: 2
  # Failures on a single provider before switching to the next
  allowed_fails: 1
  # Seconds to cool down a failed provider before trying it again
  cooldown_time: 60
  # Strategy: "simple-shuffle" tries providers in order; use "least-busy" for load balancing
  routing_strategy: simple-shuffle

litellm_settings:
  # Drop unknown params so Groq/OpenRouter don't reject the request
  drop_params: true
  # Emit structured request/response logs to stdout
  set_verbose: false
  # Cost + latency + quality logging to Langfuse (set LANGFUSE_* in .env).
  # LiteLLM computes USD cost per call from its built-in price table.
  success_callback: ["langfuse"]
  # Semantic cache: similar prompts return a cached answer before hitting Groq.
  # Needs the Redis Stack service (vector search) + the cache-embed model above.
  # Temporarily disabled — this LiteLLM image's redis-semantic cache.disconnect()
  # raises NotImplementedError during the startup/shutdown lifespan handshake,
  # crash-looping the container. Already tracked as flaky in TODO_LITELLM.md
  # ("semantic cache stores but doesn't hit"); re-enable once that's debugged.
  # cache: true
  # cache_params:
  #   type: redis-semantic
  #   similarity_threshold: 0.85          # lower = more hits, higher staleness risk
  #   redis_semantic_cache_embedding_model: ollama/nomic-embed-text  # OLLAMA_API_BASE set in compose
  #   redis_url: redis://redis:6379       # passwordless redis on the vault network
  #   ttl: 3600                           # seconds before a cached answer expires

general_settings:
  # Optional: protect the proxy with a master key (set LITELLM_MASTER_KEY in .env)
  master_key: os.environ/LITELLM_MASTER_KEY
