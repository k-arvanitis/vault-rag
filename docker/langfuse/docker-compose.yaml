services:
  langfuse-db:
    image: postgres:16
    container_name: langfuse-db
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
      PGPORT: "5433"
    volumes:
      - langfuse_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -p 5433"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse:
    image: langfuse/langfuse:2
    container_name: langfuse
    restart: unless-stopped
    network_mode: host
    depends_on:
      langfuse-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@localhost:5433/langfuse
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-changeme_secret_32chars_minimum!!}
      SALT: ${LANGFUSE_SALT:-changeme_salt}
      NEXTAUTH_URL: http://localhost:${LANGFUSE_PORT:-3000}
      PORT: "${LANGFUSE_PORT:-3000}"
      HOSTNAME: "0.0.0.0"
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      LANGFUSE_AUTO_CLICKHOUSE_MIGRATION_DISABLED: "true"

volumes:
  langfuse_db:
    name: langfuse_db
