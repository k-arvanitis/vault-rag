services:
  # ── LiteLLM proxy ──────────────────────────────────────────────────────────
  # Routes generation requests: Groq (primary) → OpenRouter (fallback on 429/503)
  # Exposes an OpenAI-compatible endpoint at http://localhost:4000/v1
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ../../litellm_config.yaml:/app/config.yaml:ro
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-}
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "2"]

  qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: qdrant-rag
    restart: unless-stopped
    ports:
      - "${QDRANT_REST_PORT:-7333}:6333"
      - "${QDRANT_GRPC_PORT:-7334}:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  lightonocr-vllm:
    image: vllm/vllm-openai:v0.17.0
    container_name: lightonocr-vllm
    restart: unless-stopped
    network_mode: host
    ipc: host
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    volumes:
      - hf_cache_lightonocr:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - ${LIGHTON_MODEL_TAG:-lightonai/lightonocr-2-1b-ocr-soup}
      - --served-model-name
      - ${LIGHTON_SERVED_MODEL_NAME:-lightonocr-2-1b-ocr-soup}
      - --host
      - 0.0.0.0
      - --port
      - "${LIGHTON_PORT:-8002}"
      - --tensor-parallel-size
      - "1"
      - --max-model-len
      - "${LIGHTON_MAX_MODEL_LEN:-16384}"
      - --gpu-memory-utilization
      - "${LIGHTON_GPU_MEMORY_UTILIZATION:-0.30}"

volumes:
  qdrant_storage:
    name: ingestion_stack_qdrant_storage
  hf_cache_lightonocr:
    name: ingestion_stack_hf_cache_lightonocr
