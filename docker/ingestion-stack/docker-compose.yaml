services:
  qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: qdrant-rag
    restart: unless-stopped
    ports:
      - "${QDRANT_REST_PORT:-7333}:6333"
      - "${QDRANT_GRPC_PORT:-7334}:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  lightonocr-vllm:
    image: vllm/vllm-openai:v0.17.0
    container_name: lightonocr-vllm
    profiles: [ingest]
    restart: unless-stopped
    network_mode: host
    ipc: host
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    volumes:
      - hf_cache_lightonocr:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - ${LIGHTON_MODEL_TAG:-lightonai/lightonocr-2-1b-ocr-soup}
      - --served-model-name
      - ${LIGHTON_SERVED_MODEL_NAME:-lightonocr-2-1b-ocr-soup}
      - --host
      - 0.0.0.0
      - --port
      - "${LIGHTON_PORT:-8002}"
      - --tensor-parallel-size
      - "1"
      - --max-model-len
      - "${LIGHTON_MAX_MODEL_LEN:-16384}"
      - --gpu-memory-utilization
      - "${LIGHTON_GPU_MEMORY_UTILIZATION:-0.30}"

  qwen35-vllm:
    image: vllm/vllm-openai:v0.17.0
    container_name: qwen35-vllm
    profiles: [ingest]
    restart: unless-stopped
    network_mode: host
    ipc: host
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    volumes:
      - hf_cache_qwen35:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - ${QWEN_MODEL_TAG:-Qwen/Qwen3.5-2B}
      - --served-model-name
      - ${QWEN_SERVED_MODEL_NAME:-Qwen/Qwen3.5-2B}
      - --host
      - 0.0.0.0
      - --port
      - "${QWEN_PORT:-8000}"
      - --tensor-parallel-size
      - "1"
      - --max-model-len
      - "${QWEN_MAX_MODEL_LEN:-16384}"
      - --gpu-memory-utilization
      - "${QWEN_GPU_MEMORY_UTILIZATION:-0.60}"
      - --limit-mm-per-prompt
      - '{"image":1}'
      - --trust-remote-code

  gen-vllm:
    image: vllm/vllm-openai:v0.17.0
    container_name: gen-vllm
    profiles: [query]
    restart: unless-stopped
    network_mode: host
    ipc: host
    dns:
      - 1.1.1.1
      - 8.8.8.8
    env_file:
      - ../../.env
    environment:
      - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    volumes:
      - hf_cache_gen:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - ${GEN_MODEL_TAG:-Qwen/Qwen3-8B}
      - --served-model-name
      - ${GEN_SERVED_MODEL_NAME:-Qwen/Qwen3-8B}
      - --host
      - 0.0.0.0
      - --port
      - "${GEN_PORT:-8003}"
      - --tensor-parallel-size
      - "1"
      - --max-model-len
      - "${GEN_MAX_MODEL_LEN:-16384}"
      - --gpu-memory-utilization
      - "${GEN_GPU_MEMORY_UTILIZATION:-0.85}"
      - --trust-remote-code
      - --enable-auto-tool-choice
      - --tool-call-parser
      - "${GEN_TOOL_CALL_PARSER:-hermes}"

volumes:
  qdrant_storage:
    name: ingestion_stack_qdrant_storage
  hf_cache_lightonocr:
    name: ingestion_stack_hf_cache_lightonocr
  hf_cache_qwen35:
    name: ingestion_stack_hf_cache_qwen35
  hf_cache_gen:
    name: ingestion_stack_hf_cache_gen
